global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'smartops-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000', 'host.docker.internal:8000', 'localhost:8000']

  - job_name: 'user-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-service:8001', 'host.docker.internal:8001', 'localhost:8001']

  - job_name: 'order-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['order-service:8002', 'host.docker.internal:8002', 'localhost:8002']

  - job_name: 'payment-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['payment-service:8003', 'host.docker.internal:8003', 'localhost:8003']
